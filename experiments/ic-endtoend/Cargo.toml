[package]
name = "ic-endtoend"
version = "0.1.0"
edition = "2021"
description = "End-to-end PKM prime-field index calculus (m = 2, 3) against Pollard rho, fully charged"
license = "MIT"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
