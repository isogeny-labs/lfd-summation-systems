name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - name: Byte-compile every Python file
        run: python -m compileall -q csd scripts experiments tests
      - name: Unit tests of the certificate code
        run: python -m pytest -q tests
      - name: Saved hashes, audit report, sweep counts, submission abstract and PDF metadata
        # Before the steps below, which rewrite a timing field and redraw figures in the checkout.
        run: |
          sudo apt-get install -y -qq poppler-utils
          python scripts/check_publication_artifacts.py
      - name: Fixed-curve growth theorem, 33 exact regressions
        run: |
          set -euo pipefail
          for script in scripts/check_n8_*.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done
      - name: Three to eight summands (second implementation against the records)
        run: python scripts/ic_bounds_msum.py selftest
      - name: Fall counterexamples (recomputed against the record and its source hashes)
        run: python scripts/verify_ic_fall_counterexamples.py > /dev/null
      - name: Growth proof, finite lemmas (Semaev identity, table of Lambda)
        run: |
          python scripts/ic_bounds_growth_lemmas.py semaev
          python scripts/ic_bounds_growth_lemmas.py lambda > /dev/null
      - name: Depth-step table (recomputed and compared with the record)
        run: |
          python scripts/run_ic_depth_step.py > /dev/null
          python - <<'PY'
          import json, subprocess
          old = json.loads(subprocess.run(['git', 'show', 'HEAD:experiments/ic-depth-step/growth.json'],
                                          capture_output=True, text=True, check=True).stdout)
          new = json.load(open('experiments/ic-depth-step/growth.json'))
          for d in (old, new):
              d.pop('elapsed_seconds', None)
          assert old == new, 'depth-step table differs from the record'
          print('depth-step table reproduced')
          PY
      - name: Figures from the records
        env:
          MPLBACKEND: Agg
        run: python scripts/plot_ic_lfd_figures.py

  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned Mathlib and its prebuilt oleans
        run: |
          lake exe cache get
      - name: Build the largest module alone (parallel jobs ran out of memory on 15 GB)
        run: lake build ICFallDegrees.GeneratedPrimeUpper
      - name: Build everything
        run: lake build
      - name: Source scan, Mathlib pin check and axiom audit
        # verify_lean_fall_degrees.py runs `lake build` again (now a no-op), then Audit.lean and
        # SparseDemo.lean, and fails on any axiom beyond propext, Classical.choice and Quot.sound.
        working-directory: .
        run: python3 scripts/verify_lean_fall_degrees.py
      - name: Every module and every printed axiom list
        # `lake build` covers the modules the root file imports. This builds the remaining ones and
        # elaborates every file with `#print axioms` (Audit.lean, the N8*Audit.lean files, and the
        # modules that print their own); it fails on any axiom beyond the three above.
        working-directory: .
        run: python3 scripts/lean_check_all.py --out "$RUNNER_TEMP/lean-check"
      - name: Keep the audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-audit
          path: |
            experiments/ic-lean/verification.json
            experiments/ic-lean/build.log
            experiments/ic-lean/axioms.log
            ${{ runner.temp }}/lean-check
