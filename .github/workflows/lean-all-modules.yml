name: Lean (every module) and N8 regressions
# Complements the default-target build: formal/ICFallDegrees.lean imports 125 of the 218 modules,
# and the fixed-curve growth theorem (GrowthFixedE6PrimeSequence) lies outside that set.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'formal/**'
      - 'scripts/lean_check_all.py'
      - 'scripts/verify_lean_fall_degrees.py'
      - 'scripts/check_n8_*.py'
      - '.github/workflows/lean-all-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-all-${{ github.ref }}
  cancel-in-progress: true
jobs:
  n8-regressions:
    name: N8 exact regressions (33 scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Run
        run: |
          set -euo pipefail
          for script in scripts/check_n8_*.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done
  lean:
    name: Cold build of every module and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Pin Lean 4.19.0 and Mathlib v4.19.0
        run: |
          test "$(cat formal/lean-toolchain)" = "leanprover/lean4:v4.19.0"
          grep -q 'rev = "v4.19.0"' formal/lakefile.toml
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: false
          use-github-cache: false
      - name: Build every module and audit every printed axiom list
        run: python3 scripts/lean_check_all.py --out "$RUNNER_TEMP/lean-check"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-check
          path: ${{ runner.temp }}/lean-check
