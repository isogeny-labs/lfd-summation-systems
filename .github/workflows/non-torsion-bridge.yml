name: Non-two-torsion algebraic bridge
on:
  pull_request:
    paths:
      - 'formal/ICFallDegrees/GrowthNonTorsion*.lean'
      - 'formal/N8NonTwoTorsionPolesAudit.lean'
      - 'scripts/check_non_torsion_axioms.py'
      - 'scripts/check_non_two_field_axioms.py'
      - 'scripts/check_non_two_poles_axioms.py'
      - '.github/workflows/non-torsion-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify dependency pins and fetch Mathlib
        working-directory: formal
        run: |
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.19.0'
          python3 - <<'PY'
          import json
          m = json.load(open('lake-manifest.json'))
          assert next(p['rev'] for p in m['packages'] if p['name'] == 'mathlib') == 'c44e0c8ee63ca166450922a373c7409c5d26b00b'
          PY
          lake exe cache get ICFallDegrees.GrowthNonTorsionFunctionField ICFallDegrees.GrowthNonTorsionTargetSecant
      - name: Kernel build and explicit transitive axiom audit
        working-directory: formal
        run: |
          set -euo pipefail
          lake build ICFallDegrees.GrowthNonTorsionFunctionField ICFallDegrees.GrowthNonTorsionTargetSecant
          lake env lean ICFallDegrees/GrowthNonTorsionBridge.lean > "$RUNNER_TEMP/non-torsion-bridge.log"
          lake env lean ICFallDegrees/GrowthNonTorsionRationalObstruction.lean > "$RUNNER_TEMP/non-torsion-rational.log"
          python3 ../scripts/check_non_torsion_axioms.py "$RUNNER_TEMP/non-torsion-bridge.log" "$RUNNER_TEMP/non-torsion-rational.log"
          lake env lean ICFallDegrees/GrowthNonTorsionFunctionField.lean > "$RUNNER_TEMP/non-torsion-field.log"
          python3 ../scripts/check_non_two_field_axioms.py "$RUNNER_TEMP/non-torsion-field.log"
          lake env lean N8NonTwoTorsionPolesAudit.lean > "$RUNNER_TEMP/non-torsion-poles.log"
          python3 ../scripts/check_non_two_poles_axioms.py "$RUNNER_TEMP/non-torsion-poles.log"
          git rev-parse HEAD > "$RUNNER_TEMP/non-torsion-source.txt"
          sha256sum ICFallDegrees/GrowthNonTorsion*.lean >> "$RUNNER_TEMP/non-torsion-source.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: non-torsion-kernel-audit
          path: ${{ runner.temp }}/non-torsion-*
